<html>
<head>

  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "/themes/ish_drupal_theme/vendor/js/threejs/three.module.js",
        "three/addons/": "/themes/ish_drupal_theme/vendor/js/threejs/jsm/"
      }
    }
  </script>

</head>
<body>

<div id="rotatingC" class="r2" style="width: 800px;
  height: 600px;
  border: 1px solid red;
  text-align: center;
  margin: auto; " >
    <span class="label">Loading...</span>
</div>

<script type="module">

  import * as THREE from 'three';

  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  const object_loader = new THREE.ObjectLoader();

  const el = document.querySelector('#rotatingC');
  const { width, height } = el.getBoundingClientRect();

  const model_path = 'tree-chickadee/chickadee_tree.glb';
  const camera_data = {
	"metadata": {
		"version": 4.7,
		"type": "Object",
		"generator": "Object3D.toJSON"
	},
	"object": {
		"uuid": "cb00dc3d-4415-4a23-8020-6c5e037b43ff",
		"type": "PerspectiveCamera",
		"name": "Camera",
		"layers": 1,
		"matrix": [-0.8261533472672535,2.7755575615628914e-17,-0.5634453361233127,0,-0.4099991558658975,0.6859332393280713,0.6011624434162122,0,0.3864858845913578,0.7276644770667997,-0.5666860416727562,0,4.406312770167925,8.296078603458266,-6.460768792988963,1],
		"up": [0,1,0],
		"fov": 50,
		"zoom": 1,
		"near": 2,
		"far": 15,
		"focus": 10,
		"aspect": 1.4755813953488373,
		"filmGauge": 35,
		"filmOffset": 0
	}
};

  let camera, controls, scene, renderer;

  init();
  // render();
  animate();

  function init() {

    const container = document.createElement( 'div' )
    const gltf_loader = new GLTFLoader().setPath( '/themes/wco_drupal_theme/vendor/threejs/models/' )
    scene = new THREE.Scene({})


    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    /* fov — Camera frustum vertical field of view.
     * aspect — Camera frustum aspect ratio.
     * near — Camera frustum near plane.
     * far — Camera frustum far plane.
    **/
    camera = new THREE.PerspectiveCamera( 0.1, width/height, 1, 1500 )
    // camera.position.set( -1.8, 2.6, 2.7 )
    camera.position.set( 5.551, 4.193, -7.819 )

    // camera = object_loader.parse(camera_data);

    gltf_loader.load( model_path, function ( gltf ) {
      document.querySelectorAll('#rotatingC span.label').forEach(el => el.style.display = 'none');
      document.getElementById('rotatingC').appendChild( container )
      scene.add( gltf.scene )
      render()
    } );

    // object_loader.load('telephone.glb.json', (obj) => {
    //   console.log('obj:', obj)
    //   document.querySelectorAll('#rotatingC span.label').forEach(el => el.style.display = 'none');
    //   document.getElementById('rotatingC').appendChild( container )
    //   scene.add(obj);
    //   render()
    // });


    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
    });
    // renderer.setClearColor( 0x000000, 0 ); // default
    renderer.setPixelRatio( window.devicePixelRatio );
    renderer.setSize( width, height );
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild( renderer.domElement );

    controls = new OrbitControls( camera, renderer.domElement );
    // controls.addEventListener( 'change', render ); // use if there is no animation loop
    controls.minDistance = 400;
    controls.maxDistance = 800;
    controls.target.set( 0, 0, - 0.2 );
    controls.autoRotate = true;
    controls.update();

    window.addEventListener( 'resize', onWindowResize );
  }

  function onWindowResize() {
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize( width, height );
    render();
  }

  function render() {
    renderer.render( scene, camera );
  }
  function animate() {
    requestAnimationFrame( animate );
    controls.update();
    renderer.render( scene, camera );
  }

</script>

</body>
</html>
