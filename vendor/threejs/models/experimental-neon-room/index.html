<html>
<head>

  <!-- Import maps polyfill -->

  <script type="importmap">
    {
      "imports": {
        "three": "/themes/wco_drupal_theme/vendor/threejs/build/three.module.js",
        "three/addons/": "/themes/wco_drupal_theme/vendor/threejs/jsm/",
        "ish/": "/themes/wco_drupal_theme/vendor/threejs/custom/"
      }
    }
  </script>

  <style>
    .rotating-ctrl-3 {
      position: relative;
    }
    .rotating-ctrl-3 .attribution {
      font-size: 0.8em;
      /* border: 1px solid yellow; */
      position: absolute;
      bottom: 0.5em;
      right: 0.5em;

      text-align: left;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0.5em;
      color: #ccc;
      padding: 0.5em;

    }
    .rotating-ctrl-3 .attribution :link {
      color: #ccc;
    }
  </style>

</head>
<body>

<div id="rotating_20260109_experimental" class="rotating-ctrl-3" style="width: 100%; height: 400px;
  border: 1px solid red;
  text-align: center;
  margin: auto; " >
    <span class="label">Loading...</span>
    <span class='attribution'>"<a href="https://skfb.ly/oHXtS">Experimental Neon Room</a>" <br />by jimbogies is licensed under <a href="http://creativecommons.org/licenses/by/4.0/">C.C.A.<a/>.</span>
</div>

<script type="module">

  const dom_id = 'rotating_20260109_experimental';
  const model_name = 'experimental-neon-room'

  import * as THREE from 'three';

  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  import { fitCameraToObject } from 'ish/shared';

  const object_loader = new THREE.ObjectLoader();

  const el = document.getElementById(dom_id);
  const { width, height } = el.getBoundingClientRect();

  const model_path = `${model_name}/model.glb`;

  let camera, controls, helper, scene, renderer;

  init();
  animate();

  function init() {

    const container = document.createElement( 'div' )
    const gltf_loader = new GLTFLoader().setPath( '/themes/wco_drupal_theme/vendor/threejs/models/' )
    scene = new THREE.Scene({})



    /* fov — Camera frustum vertical field of view.
     * aspect — Camera frustum aspect ratio.
     * near — Camera frustum near plane.
     * far — Camera frustum far plane.
    **/
    camera = new THREE.PerspectiveCamera( 45, width/height, 1, 1500 )

    scene.add(camera)


    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    // const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    // dirLight.position.set(100, 0, 100);
    // dirLight.target.position.set(0, 0, 0);
    // helper = new THREE.DirectionalLightHelper(dirLight, 5);
    // camera.add(dirLight);
    // camera.add(dirLight.target);
    // scene.add(helper);


    gltf_loader.load( model_path, function ( gltf ) {
      document.querySelectorAll(`#${dom_id} span.label`).forEach(el => el.style.display = 'none');
      document.getElementById(dom_id).appendChild( container )
      gltf.scene.scale.set(15, 15, 15);

      // const box = new THREE.Box3().setFromObject(gltf.scene);
      // const center = new THREE.Vector3();
      // box.getCenter(center);
      // gltf.scene.position.sub(center);

      // gltf.scene.position.y -= 2000;

      scene.add( gltf.scene )

      fitCameraToObject(camera, gltf.scene, controls);
      // camera.position.y += 500;
      camera.position.set(1000, 1500, 1000)

      render()
    } );

    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
    });
    // renderer.setClearColor( 0x000000, 0 ); // default
    renderer.setPixelRatio( window.devicePixelRatio );
    renderer.setSize( width, height );
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild( renderer.domElement );

    controls = new OrbitControls( camera, renderer.domElement );
    // controls.addEventListener( 'change', render ); // use if there is no animation loop
    controls.minDistance = 100;
    controls.maxDistance = 3000;
    controls.target.set( 0, 10, 0 );
    controls.autoRotate = true;
    controls.update();



    window.addEventListener( 'resize', onWindowResize );
  }

  function onWindowResize() {
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize( width, height );
    render();
  }

  function render() {
    renderer.render( scene, camera );
  }
  function animate() {
    requestAnimationFrame( animate );
    controls.update();
    renderer.render( scene, camera );
  }





</script>

</body>
</html>
