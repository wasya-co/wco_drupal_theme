<html>
<head>

  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "/themes/ish_drupal_theme/vendor/js/threejs/three.module.js",
        "three/addons/": "/themes/ish_drupal_theme/vendor/js/threejs/jsm/"
      }
    }
  </script>

</head>
<body>

<div id="rotating_20260113_bonsai_0" class="r2" style="width: 400px; height: 400px;
  border: 1px solid red;
  text-align: center;
  margin: auto; " >
    <span class="label">Loading...</span>
</div>

<script type="module">

  import * as THREE from 'three';

  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  const object_loader = new THREE.ObjectLoader();

  const el = document.querySelector('#rotating_20260113_bonsai_0');
  const { width, height } = el.getBoundingClientRect();

  const model_path = 'bonsai-0/model.glb';
  const camera_data = {
	"metadata": {
		"version": 4.7,
		"type": "Object",
		"generator": "Object3D.toJSON"
	},
	"object": {
		"uuid": "cb00dc3d-4415-4a23-8020-6c5e037b43ff",
		"type": "PerspectiveCamera",
		"name": "Camera",
		"layers": 1,
		"matrix": [-0.8261533472672535,2.7755575615628914e-17,-0.5634453361233127,0,-0.4099991558658975,0.6859332393280713,0.6011624434162122,0,0.3864858845913578,0.7276644770667997,-0.5666860416727562,0,4.406312770167925,8.296078603458266,-6.460768792988963,1],
		"up": [0,1,0],
		"fov": 50,
		"zoom": 1,
		"near": 2,
		"far": 15,
		"focus": 10,
		"aspect": 1.4755813953488373,
		"filmGauge": 35,
		"filmOffset": 0
	}
};

  let camera, controls, helper, scene, renderer;

  init();
  // render();
  animate();

  function init() {

    const container = document.createElement( 'div' )
    const gltf_loader = new GLTFLoader().setPath( '/themes/wco_drupal_theme/vendor/threejs/models/' )
    scene = new THREE.Scene({})



    /* fov — Camera frustum vertical field of view.
     * aspect — Camera frustum aspect ratio.
     * near — Camera frustum near plane.
     * far — Camera frustum far plane.
    **/
    camera = new THREE.PerspectiveCamera( 45, width/height, 1, 1500 )
    camera.position.set( 20, 20, 0 )
    scene.add(camera)
    // camera = object_loader.parse(camera_data);


    // const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    // scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(100, 0, 100);
    dirLight.target.position.set(0, 0, 0);
    helper = new THREE.DirectionalLightHelper(dirLight, 5);
    camera.add(dirLight);
    camera.add(dirLight.target);
    scene.add(helper);


    gltf_loader.load( model_path, function ( gltf ) {
      document.querySelectorAll('#rotating_20260113_bonsai_0 span.label').forEach(el => el.style.display = 'none');
      document.getElementById('rotating_20260113_bonsai_0').appendChild( container )
      gltf.scene.scale.set(15, 15, 15);

      // const box = new THREE.Box3().setFromObject(gltf.scene);
      // const center = new THREE.Vector3();
      // box.getCenter(center);
      // gltf.scene.position.sub(center);

      gltf.scene.position.y -= 100;

      scene.add( gltf.scene )
      render()
    } );

    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
    });
    // renderer.setClearColor( 0x000000, 0 ); // default
    renderer.setPixelRatio( window.devicePixelRatio );
    renderer.setSize( width, height );
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild( renderer.domElement );

    controls = new OrbitControls( camera, renderer.domElement );
    // controls.addEventListener( 'change', render ); // use if there is no animation loop
    controls.minDistance = 400;
    controls.maxDistance = 800;
    controls.target.set( 0, 10, 0 );
    controls.autoRotate = true;
    controls.update();

    window.addEventListener( 'resize', onWindowResize );
  }

  function onWindowResize() {
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize( width, height );
    render();
  }

  function render() {
    renderer.render( scene, camera );
  }
  function animate() {
    requestAnimationFrame( animate );
    controls.update();
    renderer.render( scene, camera );
  }

</script>

</body>
</html>
